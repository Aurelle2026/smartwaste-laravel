name: smartwaste

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartwaste-app:latest
    restart: unless-stopped
    environment:
      RUN_MIGRATIONS: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-smartwaste}
      DB_USERNAME: ${DB_USERNAME:-smartwaste}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - storage:/var/www/html/storage
      - app_public:/var/www/html/public
      - ./.env:/var/www/html/.env:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartwaste

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - smartwaste

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-smartwaste}
      POSTGRES_USER: ${DB_USERNAME:-smartwaste}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-smartwaste} -d ${DB_DATABASE:-smartwaste}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smartwaste

  queue:
    image: smartwaste-app:latest
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - smartwaste

  scheduler:
    image: smartwaste-app:latest
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - smartwaste

volumes:
  db_data:
  storage:
  app_public:

networks:
  smartwaste:
    driver: bridge
